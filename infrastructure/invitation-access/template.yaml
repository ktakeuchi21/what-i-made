AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Invitation-only identity and protected services for What I Made.

Parameters:
  AppOrigin:
    Type: String
    Description: Exact HTTPS origin of the deployed PWA.
    AllowedPattern: ^https://[^/]+$
  CallbackUrl:
    Type: String
    Description: Exact deployed PWA callback URL.
    AllowedPattern: ^https://.+$
  AdminCallbackUrl:
    Type: String
    Description: Exact owner analytics callback URL ending in /admin/.
    AllowedPattern: ^https://.+/admin/$
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: ^[a-z0-9-]{3,63}$
  ImageTokenSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  CaptureBedrockModelId:
    Type: String
    Default: openai.gpt-oss-20b
  RecipeBedrockModelId:
    Type: String
    Default: openai.gpt-5.6-terra
  TranscribeVocabularyName:
    Type: String
    Default: ""
    AllowedPattern: ^$|^[0-9A-Za-z._-]{1,200}$
  ServicesEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  AnalyticsLaunchDate:
    Type: String
    Default: "2026-09-10"
    AllowedPattern: ^\d{4}-\d{2}-\d{2}$
  ReservedConcurrency:
    Type: Number
    Default: 0
    AllowedValues: [0, 2]
    Description: Use 2 only after the account concurrency quota can retain ten unreserved executions; 0 omits the setting.

Conditions:
  UseReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Tracing: Active
    Environment:
      Variables:
        COGNITO_CLIENT_ID: !Ref WebClient
        RATE_LIMIT_TABLE: !Ref RateLimitTable

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DependsOn: AnalyticsPostAuthenticationPermission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: what-i-made-invited-users
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      LambdaConfig:
        PostAuthentication: !GetAtt AnalyticsPostAuthenticationFunction.Arn
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      Policies:
        SignInPolicy:
          # Cognito's live CreateUserPool API currently requires PASSWORD to be
          # present when EMAIL_OTP is configured. Invitees are still provisioned
          # without passwords and self-service password recovery is disabled.
          AllowedFirstAuthFactors: [PASSWORD, EMAIL_OTP]

  ServiceScopes:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: what-i-made
      Name: What I Made services
      Scopes:
        - ScopeName: capture
          ScopeDescription: Use voice transcription and capture assistance
        - ScopeName: recipes
          ScopeDescription: Import, search, and generate recipe ideas
        - ScopeName: activity
          ScopeDescription: Submit privacy-safe archive activity metadata
        - ScopeName: admin
          ScopeDescription: Read owner-only product analytics

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ServiceScopes
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: what-i-made-pwa
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows: [ALLOW_USER_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, what-i-made/capture, what-i-made/recipes, what-i-made/activity, what-i-made/admin]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Ref CallbackUrl, !Ref AdminCallbackUrl]
      LogoutURLs: [!Ref CallbackUrl, !Ref AdminCallbackUrl]
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  ManagedLoginDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: ManagedLoginDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebClient
      UseCognitoProvidedValues: true

  PrivateApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: [!Ref AppOrigin]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref WebClient]

  RateLimitTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accountWindow
          AttributeType: S
      KeySchema:
        - AttributeName: accountWindow
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AnalyticsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AnalyticsAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: what-i-made-admins
      Description: Owner-only access to privacy-safe product analytics
      UserPoolId: !Ref UserPool

  AnalyticsPostAuthenticationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../services/analytics
      Handler: lambda.postAuthenticationHandler
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          COGNITO_CLIENT_ID: ""
          ANALYTICS_TABLE: !Ref AnalyticsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt AnalyticsTable.Arn

  AnalyticsPostAuthenticationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AnalyticsPostAuthenticationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../services/analytics
      Handler: lambda.handler
      MemorySize: 256
      Timeout: 30
      ReservedConcurrentExecutions: !If [UseReservedConcurrency, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      Environment:
        Variables:
          ANALYTICS_TABLE: !Ref AnalyticsTable
          ANALYTICS_LAUNCH_DATE: !Ref AnalyticsLaunchDate
          ADMIN_GROUP_NAME: what-i-made-admins
          USER_POOL_ID: !Ref UserPool
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt AnalyticsTable.Arn
            - Effect: Allow
              Action: cognito-idp:ListUsers
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*
      Events:
        Activity:
          Type: HttpApi
          Properties: { ApiId: !Ref PrivateApi, Path: /v1/activity/events, Method: POST, Auth: { Authorizer: CognitoJwt, AuthorizationScopes: [what-i-made/activity] } }
        AdminSummary:
          Type: HttpApi
          Properties: { ApiId: !Ref PrivateApi, Path: /v1/admin/analytics/summary, Method: GET, Auth: { Authorizer: CognitoJwt, AuthorizationScopes: [what-i-made/admin] } }
        AdminUsers:
          Type: HttpApi
          Properties: { ApiId: !Ref PrivateApi, Path: /v1/admin/analytics/users, Method: GET, Auth: { Authorizer: CognitoJwt, AuthorizationScopes: [what-i-made/admin] } }
        AdminUser:
          Type: HttpApi
          Properties: { ApiId: !Ref PrivateApi, Path: "/v1/admin/analytics/users/{accountId}", Method: GET, Auth: { Authorizer: CognitoJwt, AuthorizationScopes: [what-i-made/admin] } }
        AdminErase:
          Type: HttpApi
          Properties: { ApiId: !Ref PrivateApi, Path: /v1/admin/analytics, Method: DELETE, Auth: { Authorizer: CognitoJwt, AuthorizationScopes: [what-i-made/admin] } }

  CaptureAssistanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../services/capture-assistance
      Handler: lambda.handler
      MemorySize: 256
      Timeout: 15
      ReservedConcurrentExecutions: !If [UseReservedConcurrency, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      Environment:
        Variables:
          CAPTURE_ASSISTANCE_ENABLED: !Ref ServicesEnabled
          BEDROCK_MODEL_ID: !Ref CaptureBedrockModelId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - "bedrock-mantle:CreateInference"
                - "bedrock:InvokeModel"
              Resource: "*"
              Condition:
                StringEquals: { "aws:RequestedRegion": !Ref "AWS::Region" }
            - Effect: Allow
              Action: "dynamodb:UpdateItem"
              Resource: !GetAtt RateLimitTable.Arn
      Events:
        ParseCook:
          Type: HttpApi
          Properties:
            ApiId: !Ref PrivateApi
            Path: /v1/parse-cook
            Method: POST
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes: [what-i-made/capture]

  TranscribeSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../spikes/iphone-feasibility/backend/session
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      ReservedConcurrentExecutions: !If [UseReservedConcurrency, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      Environment:
        Variables:
          VOICE_ENABLED: !Ref ServicesEnabled
          PRESIGN_EXPIRES_SECONDS: "15"
          TRANSCRIBE_VOCABULARY_NAME: !Ref TranscribeVocabularyName
      Policies:
        - Statement:
            - Effect: Allow
              Action: "transcribe:StartStreamTranscriptionWebSocket"
              Resource: "*"
            - Effect: Allow
              Action: "dynamodb:UpdateItem"
              Resource: !GetAtt RateLimitTable.Arn
      Events:
        Session:
          Type: HttpApi
          Properties:
            ApiId: !Ref PrivateApi
            Path: /v1/transcribe-session
            Method: POST
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes: [what-i-made/capture]

  RecipeIdeasFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../services/recipe-ideas
      Handler: lambda.handler
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: !If [UseReservedConcurrency, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      Environment:
        Variables:
          RECIPE_IDEAS_ENABLED: !Ref ServicesEnabled
          BEDROCK_MODEL_ID: !Ref RecipeBedrockModelId
          IMAGE_TOKEN_SECRET: !Ref ImageTokenSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - "bedrock-mantle:CreateInference"
                - "bedrock-websearch:InvokeSearch"
                - "bedrock-websearch:InvokeFetch"
              Resource: "*"
              Condition:
                StringEquals: { "aws:RequestedRegion": !Ref "AWS::Region" }
            - Effect: Allow
              Action: "dynamodb:UpdateItem"
              Resource: !GetAtt RateLimitTable.Arn
      Events:
        Import:
          Type: HttpApi
          Properties: { ApiId: !Ref PrivateApi, Path: /v1/recipes/import, Method: POST, Auth: { Authorizer: CognitoJwt, AuthorizationScopes: [what-i-made/recipes] } }
        Search:
          Type: HttpApi
          Properties: { ApiId: !Ref PrivateApi, Path: /v1/recipes/search, Method: POST, Auth: { Authorizer: CognitoJwt, AuthorizationScopes: [what-i-made/recipes] } }
        Generate:
          Type: HttpApi
          Properties: { ApiId: !Ref PrivateApi, Path: /v1/recipes/generate, Method: POST, Auth: { Authorizer: CognitoJwt, AuthorizationScopes: [what-i-made/recipes] } }
        Image:
          Type: HttpApi
          Properties: { ApiId: !Ref PrivateApi, Path: /v1/recipes/image, Method: GET, Auth: { Authorizer: CognitoJwt, AuthorizationScopes: [what-i-made/recipes] } }

Outputs:
  AwsRegion:
    Value: !Ref "AWS::Region"
  UserPoolId:
    Value: !Ref UserPool
  WebClientId:
    Value: !Ref WebClient
  ManagedLoginDomain:
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  ApiBaseUrl:
    Value: !Sub https://${PrivateApi}.execute-api.${AWS::Region}.amazonaws.com
  AnalyticsTableName:
    Value: !Ref AnalyticsTable
  AnalyticsAdminGroupName:
    Value: !Ref AnalyticsAdminGroup
